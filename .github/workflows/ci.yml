name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore back/Warehouse.sln
      - name: Restore .NET tools
        run: dotnet tool restore
        working-directory: back
      - name: Build
        run: dotnet build back/Warehouse.sln --no-restore --configuration Release
      - name: Test (unit + integration + API via Testcontainers)
        run: dotnet test back/Warehouse.sln --configuration Release --no-build --verbosity normal
        # Integration/API tests spin up a PostgreSQL 16 container;
        # Docker is preinstalled on ubuntu-latest runners
      - name: Verify EF Core migrations are up-to-date
        run: dotnet ef migrations has-pending-model-changes --project Warehouse.Infrastructure --startup-project Warehouse.Api
        working-directory: back

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30 -> undici 8 требует Node >= 22.19 (worker_threads.markAsUncloneable)
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
